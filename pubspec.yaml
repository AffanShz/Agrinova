name: agrinova
description: "Asisten pertanian cerdas AgriNova"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  connectivity_plus: ^6.1.0
  geolocator: ^12.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.6.0
  intl: 0.20.2
  permission_handler: ^11.3.0
  supabase_flutter: ^2.0.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

  cached_network_image: ^3.4.1

  table_calendar: ^3.1.2
  workmanager: ^0.7.0
  flutter_secure_storage: ^10.0.0
  image_picker: ^1.1.0
  url_launcher: ^6.2.0
  easy_localization: ^3.0.8
  shimmer: ^3.0.0
  google_generative_ai: ">=0.4.7 <2.0.0"
  flutter_cache_manager: ^3.4.1
  flutter_markdown: ^0.7.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - katalog_obat_tanaman.json
    - assets/images/
    - assets/translations/

